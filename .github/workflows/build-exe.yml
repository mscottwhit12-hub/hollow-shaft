name: Build Windows .exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed
          --name HollowShaftOptimizer
          --hidden-import PIL._tkinter_finder
          shaft_optimizer.py

      - name: Smoke test (console mode)
        shell: pwsh
        run: |
          pyinstaller --onefile --name HollowShaftCLI --hidden-import PIL._tkinter_finder shaft_optimizer.py
          .\dist\HollowShaftCLI.exe --nogui
          if (-not (Test-Path .\dist\results\feasible_designs.csv)) { throw "No results written" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HollowShaftOptimizer-windows
          path: dist/HollowShaftOptimizer.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hollow Shaft Optimizer (build ${{ github.run_number }})
          body: |
            Windows build from commit ${{ github.sha }}.
            Download HollowShaftOptimizer.exe and double-click it. No Python install needed.
          files: dist/HollowShaftOptimizer.exe
